[package]
name = "frosty-companion"
description = "Frosty, a personal digital companion"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on
# Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frosty_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
frosty-core.workspace = true
frosty-host.workspace = true
rusqlite = "0.40.2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.2", features = ["sync", "time"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v7"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
