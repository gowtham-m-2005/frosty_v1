[package]
name = "spike-capability"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike: its own workspace so CI and the real build ignore it.
[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
